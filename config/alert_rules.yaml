alerts:
  - name: High API latency
    severity: warning
    condition: P95 request latency exceeds 3000 ms for 10 minutes
    type: symptom-based
    owner: Observability team
    runbook: docs/alerts.md#alert-1
  - name: Elevated API error rate
    severity: critical
    condition: Error rate exceeds 2% for 5 minutes
    type: symptom-based
    owner: API team
    runbook: docs/alerts.md#alert-2
  - name: Quality proxy degradation
    severity: warning
    condition: Mean quality score is below 0.75 for 15 minutes
    type: symptom-based
    owner: AI team
    runbook: docs/alerts.md#alert-3
